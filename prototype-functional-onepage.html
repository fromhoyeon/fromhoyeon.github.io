<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hoyeon Choi</title>
  <meta name="description" content="Portfolio of Hoyeon Choi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f2f2ef;
      --fg:#111;
      --muted:#6a6a66;
      --line:#bdbdb7;
      --panel:#d8d8d1;
      --accent-blue:#2458d3;
      --accent-blue-deep:#173f9f;
      --accent-blue-soft:#edf3ff;
      --accent-green:#2f855a;
      --accent-green-deep:#20683f;
      --accent-green-soft:#edf8f1;
      --content:680px;
      --wide:1080px;
      --video:900px;
      --s:8px;
      --m:16px;
      --l:32px;
      --xl:64px;
      --work-gap:128px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans KR',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
    body.lightbox-open{overflow:hidden}
    a{color:inherit;text-decoration:none}
    p,h1,h2,h3,figure{margin:0}
    button{font:inherit;color:inherit}
    .shell{width:min(calc(100% - 24px),var(--content));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(242,242,239,.96);border-bottom:1px solid var(--line)}
    .topbar .shell{min-height:44px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--m)}
    .brand{font-size:13px;font-weight:700;letter-spacing:-.02em}
    .nav{display:flex;gap:var(--m);font-size:11px;text-transform:uppercase}
    .nav a{padding:14px 0 12px}
    .intro{padding:var(--l) 0 var(--xl);display:grid;gap:var(--l)}
    .intro h1{max-width:620px;font-size:clamp(32px,5.5vw,50px);line-height:1;letter-spacing:-.05em;font-weight:500}
    .intro-copy{display:grid;grid-template-columns:1fr auto;gap:var(--m);align-items:end;padding-top:var(--m);border-top:1px solid var(--line)}
    .intro-copy p{max-width:470px}
    .intro-copy span{font-size:11px;color:var(--muted);text-align:right}
    .index{border-top:1px solid var(--fg);margin-bottom:var(--xl)}
    .index a{display:grid;grid-template-columns:32px 1fr auto;gap:var(--m);align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
    .index .num,.index .year{color:var(--muted);font-size:10px}
    .work{padding:0 0 var(--work-gap)}
    .work-head{display:grid;grid-template-columns:32px 1fr auto;gap:var(--m);align-items:start;border-top:1px solid var(--fg);padding:10px 0 var(--m)}
    .num,.meta{font-size:10px;color:var(--muted);text-transform:uppercase}
    .work-title{font-size:24px;line-height:1;letter-spacing:-.035em;font-weight:700}
    .work-meta{text-align:right;font-size:10px;line-height:1.4;color:var(--muted);text-transform:uppercase}
    .media{width:100%;background:var(--panel);position:relative;overflow:hidden}
    .media::after{content:attr(data-label);position:absolute;left:8px;bottom:7px;font-size:9px;color:rgba(17,17,17,.56);letter-spacing:.02em}
    .media.landscape{aspect-ratio:16/10}
    .description{display:grid;grid-template-columns:1fr auto;gap:var(--m);align-items:start;padding-top:var(--m)}
    .description p{max-width:500px;font-size:13px}
    .action{border:1px solid var(--fg);padding:6px 8px 5px;font-size:10px;text-transform:uppercase;white-space:nowrap}
    button.action{background:transparent;cursor:pointer}
    .action:hover{background:var(--fg);color:var(--bg)}
    .small-strip{margin-top:var(--m);display:flex;flex-wrap:wrap;gap:6px}
    .tag{border:1px solid var(--line);padding:4px 6px 3px;font-size:9px;color:var(--muted);text-transform:uppercase}

    .photo-breakout{width:min(calc(100vw - 24px),var(--wide));margin-left:50%;transform:translateX(-50%)}
    .photo-grid{width:100%;min-height:180px}
    .photo-row{display:flex;width:100%;gap:var(--s);margin-bottom:var(--s);align-items:flex-start}
    .photo-row:last-child{margin-bottom:0}
    .photo-cell{appearance:none;border:0;padding:0;position:relative;flex:0 0 auto;overflow:hidden;background:#d0d0ca;cursor:zoom-in}
    .photo-cell img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-cell:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
    .photo-actions{display:flex;justify-content:flex-end;gap:var(--m);align-items:center;margin-top:var(--m)}
    #shuffle-photos{padding:8px 11px 7px;border-color:var(--accent-blue);background:var(--accent-blue);color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em}
    #shuffle-photos:hover,#shuffle-photos:focus-visible{border-color:var(--accent-blue-deep);background:var(--accent-blue-deep);color:#fff}
    #shuffle-photos:focus-visible{outline:2px solid var(--accent-blue-soft);outline-offset:2px}
    #shuffle-photos:disabled{opacity:.45;cursor:wait}

    .lightbox{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:12px;background:#fff;cursor:default;touch-action:pan-y}
    .lightbox.is-open{display:grid}
    .lightbox img{display:block;max-width:calc(100vw - 24px);max-height:calc(100svh - 24px);width:auto;height:auto;object-fit:contain;cursor:grab;user-select:none;-webkit-user-drag:none}
    .lightbox-status{position:fixed;left:50%;bottom:18px;z-index:102;transform:translate(-50%,8px);opacity:0;pointer-events:none;border:1px solid rgba(17,17,17,.45);background:rgba(255,255,255,.94);color:#111;padding:7px 9px 6px;font-size:10px;line-height:1.35;text-align:center;text-transform:uppercase;letter-spacing:.03em;white-space:pre-line;transition:opacity .16s ease,transform .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease}
    .lightbox-status.is-visible{opacity:1;transform:translate(-50%,0)}
    .lightbox-status.is-info{border-color:var(--accent-blue);background:var(--accent-blue-soft);color:var(--accent-blue-deep)}
    .lightbox-status.is-success{border-color:var(--accent-green);background:var(--accent-green-soft);color:var(--accent-green-deep)}

    .live-breakout{width:min(calc(100vw - 24px),var(--wide));margin-left:50%;transform:translateX(-50%)}
    .live-stage{width:100%;height:clamp(420px,70vh,720px);position:relative;overflow:hidden;background:transparent;border:0;touch-action:pan-y}
    .live-frame{width:100%;height:100%;display:block;border:0;background:#000}
    .live-gate{position:absolute;inset:8px;display:grid;place-items:center;background:#292d32;color:#fff;pointer-events:none;touch-action:pan-y}
    .live-gate-inner{width:min(calc(100% - 32px),420px);display:grid;gap:18px}
    .live-gate-label{font-size:10px;line-height:1.4;letter-spacing:.05em;color:rgba(255,255,255,.66);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:9px}
    .live-gate-title{font-size:clamp(24px,5vw,38px);line-height:1;font-weight:600;letter-spacing:-.035em}
    .live-gate-actions{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
    .live-gate .action{border-color:rgba(255,255,255,.72);color:#fff;background:rgba(0,0,0,.12)}
    .live-gate .action:hover,.live-gate .action:focus-visible{background:#fff;color:#111}

    .video-breakout{width:min(calc(100vw - 24px),var(--video));margin-left:50%;transform:translateX(-50%)}
    .yt-stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
    .yt-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .yt-poster{appearance:none;border:0;padding:0;margin:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;background:#000}
    .yt-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .yt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:42px;border:1px solid rgba(255,255,255,.8);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
    .yt-poster:hover .yt-play{background:#000}
    .yt-empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.58);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
    .about{border-top:1px solid var(--fg);padding:10px 0 var(--xl);display:grid;gap:var(--l)}
    .about h2{font-size:24px;letter-spacing:-.035em}
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--l);font-size:13px}
    .about-grid p+p{margin-top:var(--m)}
    .label{font-size:9px;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s)}
    .links{border-top:1px solid var(--line)}
    .links a{display:grid;grid-template-columns:1fr auto;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
    footer{border-top:1px solid var(--fg);padding:10px 0 var(--l);display:flex;justify-content:space-between;gap:var(--m);font-size:10px;color:var(--muted)}

    @media (max-width:620px){
      :root{--l:24px;--xl:48px;--s:5px;--work-gap:96px}
      .shell{width:calc(100% - 20px)}
      .topbar .shell{min-height:40px}
      .nav{gap:12px}
      .nav a{padding:12px 0 10px}
      .intro{padding-top:24px}
      .intro h1{font-size:9vw;font-weight:500;line-height:1}
      .intro-copy{grid-template-columns:1fr}
      .intro-copy span{text-align:left}
      .index a,.work-head{grid-template-columns:24px 1fr auto;gap:10px}
      .work-title{font-size:21px}
      .description{grid-template-columns:1fr}
      .description .action{justify-self:start}
      .photo-breakout,.live-breakout,.video-breakout{width:100vw}
      .live-stage{height:72svh}
      .live-gate{inset:7px}
      .live-gate-inner{width:calc(100% - 28px)}
      .live-gate-actions{display:grid;grid-template-columns:1fr 1fr}
      .live-gate .action{text-align:center;padding:9px 8px 8px}
      .photo-actions{align-items:flex-start}
      .about-grid{grid-template-columns:1fr}
      .lightbox{padding:6px}
      .lightbox img{max-width:calc(100vw - 12px);max-height:calc(100svh - 12px)}
      .lightbox-status{bottom:12px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <a class="brand" href="#top"></a>
      <nav class="nav" aria-label="Primary"></nav>
    </div>
  </header>

  <main id="top">
    <section class="shell intro">
      <h1></h1>
      <div class="intro-copy">
        <p></p>
      </div>
    </section>

    <nav class="shell index" id="work" aria-label="Work index"></nav>

    <section class="shell work" id="dual" hidden>
      <header class="work-head">
        <span class="num"></span>
        <h2 class="work-title"></h2>
        <div class="work-meta"></div>
      </header>
      <div class="video-breakout">
        <div class="yt-stage" data-youtube-stage="dual" aria-label="Video"></div>
      </div>
      <div class="description">
        <p></p>
        <a class="action" data-youtube-action="dual" href="#" hidden></a>
      </div>
      <div class="small-strip" hidden></div>
    </section>

    <section class="shell work" id="photo" hidden>
      <header class="work-head">
        <span class="num"></span>
        <h2 class="work-title"></h2>
        <div class="work-meta"></div>
      </header>
      <div class="photo-breakout">
        <div class="photo-grid" id="photo-grid" aria-label="Selected photography"></div>
      </div>
      <div class="photo-actions">
        <button class="action" id="shuffle-photos" type="button">Shuffle selection</button>
      </div>
      <div class="description">
        <p></p>
        <a class="action" href="#" hidden></a>
      </div>
    </section>

    <section class="shell work" id="dodrei" hidden>
      <header class="work-head">
        <span class="num"></span>
        <h2 class="work-title"></h2>
        <div class="work-meta"></div>
      </header>
      <div class="live-breakout">
        <div class="live-stage" id="dodrei-stage">
          <div class="live-gate" id="dodrei-gate">
            <div class="live-gate-inner">
              <div class="live-gate-label">Interactive browser work / touch to choose playback</div>
              <div class="live-gate-title"></div>
              <div class="live-gate-actions">
                <button class="action" id="dodrei-play-here" type="button">Play here</button>
                <a class="action" href="https://fromhoyeon.github.io/dodrei/web/" target="_blank" rel="noopener">Open in new window ↗</a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="description">
        <p></p>
        <a class="action" href="#" hidden></a>
      </div>
    </section>

    <section class="shell work" id="moving" hidden>
      <header class="work-head">
        <span class="num"></span>
        <h2 class="work-title"></h2>
        <div class="work-meta"></div>
      </header>
      <div class="video-breakout">
        <div class="yt-stage" data-youtube-stage="moving" aria-label="Video"></div>
      </div>
      <div class="description">
        <p></p>
        <a class="action" data-youtube-action="moving" href="#" hidden></a>
      </div>
    </section>

    <section class="shell about" id="about">
      <h2></h2>
      <div class="about-grid">
        <div><p class="label"></p><p></p></div>
        <div><p class="label"></p><p></p></div>
      </div>
    </section>

    <section class="shell" id="links">
      <div class="links"></div>
      <footer><span></span><span></span></footer>
    </section>
  </main>

  <div class="lightbox" id="photo-lightbox" role="dialog" aria-modal="true" aria-label="Expanded photograph" aria-hidden="true">
    <img id="lightbox-image" alt="" draggable="false">
    <div class="lightbox-status" id="lightbox-status" role="status" aria-live="polite"></div>
  </div>

  <script src="assets/content/site-copy.js?v=20260905-2"></script>
  <script src="assets/content/sanity-config.js"></script>
  <script src="assets/content/sanity-runtime.js?v=20260906-1"></script>
  <script>
    const photoGrid = document.querySelector('#photo-grid');
    const shufflePhotos = document.querySelector('#shuffle-photos');
    const lightbox = document.querySelector('#photo-lightbox');
    const lightboxImage = document.querySelector('#lightbox-image');
    const lightboxStatus = document.querySelector('#lightbox-status');
    let photos = [];
    let resizeTimer = null;
    let lightboxIndex = -1;
    let swipeStartX = null;
    let swipeStartY = null;
    let lightboxStatusTimer = null;
    let photoShuffleInProgress = false;

    function shuffled(items){
      const copy=[...items];
      for(let i=copy.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]]=[copy[j],copy[i]];
      }
      return copy;
    }

    function restoreGalleryViewport(anchorTop){
      if(anchorTop===null||anchorTop===undefined) return;
      requestAnimationFrame(()=>{
        const delta=photoGrid.getBoundingClientRect().top-anchorTop;
        if(Math.abs(delta)<.5) return;
        const root=document.documentElement;
        const previousBehavior=root.style.scrollBehavior;
        root.style.scrollBehavior='auto';
        window.scrollBy(0,delta);
        requestAnimationFrame(()=>{root.style.scrollBehavior=previousBehavior});
      });
    }

    function showLightboxMessage(message,duration=1500,tone='neutral'){
      if(!lightboxStatus) return;
      clearTimeout(lightboxStatusTimer);
      lightboxStatus.textContent=message;
      lightboxStatus.classList.remove('is-info','is-success');
      if(tone==='info') lightboxStatus.classList.add('is-info');
      if(tone==='success') lightboxStatus.classList.add('is-success');
      lightboxStatus.classList.add('is-visible');
      lightboxStatusTimer=setTimeout(()=>{
        lightboxStatus.classList.remove('is-visible');
      },duration);
    }

    function clearLightboxMessage(){
      clearTimeout(lightboxStatusTimer);
      lightboxStatusTimer=null;
      if(!lightboxStatus) return;
      lightboxStatus.classList.remove('is-visible','is-info','is-success');
      lightboxStatus.textContent='';
    }

    // Public photography is populated only by the Sanity photo-pool controller.
    async function createPhotoSet(){ return false; }

    function desiredRowHeight(width){
      if(width<420) return 118;
      if(width<620) return 150;
      if(width<900) return 205;
      return 250;
    }

    function makeRows(items,width,gap,targetHeight){
      const rows=[];
      let current=[];
      let ratioSum=0;
      items.forEach((item,index)=>{
        current.push(item);
        ratioSum+=item.ratio;
        const estimatedWidth=ratioSum*targetHeight+gap*(current.length-1);
        const isLast=index===items.length-1;
        if(estimatedWidth>=width*.94||isLast){rows.push(current);current=[];ratioSum=0}
      });
      return rows;
    }

    function makeMobileRows(items,rowCount=4){
      const rows=[];
      const base=Math.floor(items.length/rowCount);
      const remainder=items.length%rowCount;
      let cursor=0;
      for(let i=0;i<rowCount;i++){
        const count=base+(i<remainder?1:0);
        if(count<=0) continue;
        rows.push(items.slice(cursor,cursor+count));
        cursor+=count;
      }
      return rows;
    }

    function layoutPhotos(){
      const width=photoGrid.clientWidth;
      if(!width||!photos.length) return;
      const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||8;
      const targetHeight=desiredRowHeight(width);
      const isMobile=window.matchMedia('(max-width:620px)').matches;
      const rows=isMobile?makeMobileRows(photos,4):makeRows(photos,width,gap,targetHeight);
      photoGrid.innerHTML='';

      rows.forEach((row,rowIndex)=>{
        const isLast=rowIndex===rows.length-1;
        const ratioSum=row.reduce((sum,item)=>sum+item.ratio,0);
        const usableWidth=width-gap*(row.length-1);
        const justifiedHeight=usableWidth/ratioSum;
        let rowHeight=justifiedHeight;
        if(!isMobile&&isLast&&justifiedHeight>targetHeight*1.18) rowHeight=targetHeight;
        if(!isMobile) rowHeight=Math.max(82,Math.min(rowHeight,330));

        const rowEl=document.createElement('div');
        rowEl.className='photo-row';
        row.forEach(item=>{
          const cell=document.createElement('button');
          cell.className='photo-cell';
          cell.type='button';
          cell.style.width=`${item.ratio*rowHeight}px`;
          cell.style.height=`${rowHeight}px`;
          cell.setAttribute('aria-label',`Enlarge ${item.file||item.title||'photograph'}`);
          const img=document.createElement('img');
          img.src=item.src;
          img.alt=item.alt||'';
          img.loading='lazy';
          img.decoding='async';
          cell.appendChild(img);
          cell.addEventListener('click',()=>openLightbox(item));
          rowEl.appendChild(cell);
        });
        photoGrid.appendChild(rowEl);
      });
    }

    function showLightboxIndex(index){
      if(!photos.length) return;
      lightboxIndex=Math.max(0,Math.min(index,photos.length-1));
      const item=photos[lightboxIndex];
      lightboxImage.src=item.fullSrc||item.src;
      lightboxImage.alt=item.alt||item.title||item.file||'';

      const next=photos[lightboxIndex+1];
      const prev=photos[lightboxIndex-1];
      [next,prev].forEach(neighbor=>{
        if(!neighbor) return;
        const preload=new Image();
        preload.src=neighbor.fullSrc||neighbor.src;
      });
    }

    function openLightbox(item){
      const index=Math.max(0,photos.indexOf(item));
      clearLightboxMessage();
      showLightboxIndex(index);
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden','false');
      document.body.classList.add('lightbox-open');
    }

    // Replaced by photo-pool-controls.js once the canonical Sanity pool is available.
    async function reshuffleFromLightboxEnd(){ return false; }

    function stepLightbox(direction){
      if(!lightbox.classList.contains('is-open')||!photos.length) return;

      if(direction<0){
        if(lightboxIndex<=0){
          showLightboxMessage(`First image · 1 / ${photos.length}`);
          return;
        }
        const nextIndex=lightboxIndex-1;
        showLightboxIndex(nextIndex);
        if(nextIndex===0) showLightboxMessage(`First image · 1 / ${photos.length}`);
        return;
      }

      if(direction>0){
        if(lightboxIndex>=photos.length-1){
          reshuffleFromLightboxEnd();
          return;
        }
        const nextIndex=lightboxIndex+1;
        showLightboxIndex(nextIndex);
        if(nextIndex===photos.length-1) reshuffleFromLightboxEnd();
      }
    }

    function closeLightbox(){
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden','true');
      lightboxImage.removeAttribute('src');
      document.body.classList.remove('lightbox-open');
      clearLightboxMessage();
      lightboxIndex=-1;
    }

    shufflePhotos.addEventListener('click',()=>createPhotoSet({preservePosition:true}));
    lightbox.addEventListener('click',(event)=>{if(event.target===lightbox) closeLightbox()});
    lightbox.addEventListener('touchstart',(event)=>{
      const touch=event.changedTouches[0];
      swipeStartX=touch.clientX;
      swipeStartY=touch.clientY;
    },{passive:true});
    lightbox.addEventListener('touchend',(event)=>{
      if(swipeStartX===null||swipeStartY===null) return;
      const touch=event.changedTouches[0];
      const dx=touch.clientX-swipeStartX;
      const dy=touch.clientY-swipeStartY;
      swipeStartX=null;
      swipeStartY=null;
      if(Math.abs(dx)<45||Math.abs(dx)<=Math.abs(dy)) return;
      stepLightbox(dx<0?1:-1);
    },{passive:true});
    document.addEventListener('keydown',(event)=>{
      if(!lightbox.classList.contains('is-open')) return;
      if(event.key==='Escape') closeLightbox();
      if(event.key==='ArrowRight') stepLightbox(1);
      if(event.key==='ArrowLeft') stepLightbox(-1);
    });
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layoutPhotos,90)});
  </script>
  <script src="assets/content/sanity-prototype-bridge.js?v=20260906-1"></script>
</body>
</html>

name: Reset YouTube embed defaults

on:
  push:
    paths:
      - '.github/workflows/reset-youtube-embed-default.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset curated video embed to default YouTube player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/content/video-collection.js')
          js = js_path.read_text()
          start_marker = "      stage.replaceChildren();\n      const poster = document.createElement('button');"
          end_marker = "      currentTitle.textContent = item.title || 'Untitled video';"
          start = js.find(start_marker)
          end = js.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('curated video poster/embed block not found')
          replacement = "      stage.replaceChildren();\n      const iframe = document.createElement('iframe');\n      iframe.title = `${item.title || 'YouTube'} video player`;\n      iframe.src = `https://www.youtube.com/embed/${item.videoId}`;\n      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';\n      iframe.referrerPolicy = 'strict-origin-when-cross-origin';\n      iframe.setAttribute('allowfullscreen', '');\n      stage.appendChild(iframe);\n\n"
          js = js[:start] + replacement + js[end:]
          js_path.write_text(js)

          index_path = Path('index.html')
          index = index_path.read_text()
          index, count = re.subn(r'assets/content/video-collection\.js\?v=20260907-\d+', 'assets/content/video-collection.js?v=20260907-8', index, count=1)
          if count != 1:
              raise SystemExit('video collection script cache version not found')
          index_path.write_text(index)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = re.sub(r'- 선택된 영상은 상단 16:9 player에 표시한다\.[^\n]*\n', '- 선택된 영상은 상단 16:9 YouTube 기본 embed player에 표시한다. 별도 player parameter를 붙이지 않으며 재생, controls, 자막과 기타 UI는 YouTube 기본 동작을 따른다.\n', readme, count=1)
          readme_path.write_text(readme)
          PY
      - name: Validate JavaScript
        run: node --check assets/content/video-collection.js
      - name: Commit changes
        run: |
          git config user.name "fromhoyeon"
          git config user.email "fromhoyeon@gmail.com"
          git add assets/content/video-collection.js index.html README.md
          git commit -m "Reset YouTube embed to default player"
          git push

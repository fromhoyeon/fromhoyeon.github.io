name: Temporary playlist extraction

on:
  push:
    paths:
      - '.github/workflows/temp-playlist-extract.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: python3 -m pip install --quiet yt-dlp
      - name: Extract playlist items and descriptions
        env:
          PLAYLIST_URL: 'https://youtube.com/playlist?list=PLRqFciRyz-lRY1F4P54rSJMI7_WCZ_-AZ'
        run: |
          yt-dlp --ignore-errors --skip-download --dump-single-json "$PLAYLIST_URL" > /tmp/playlist.json
          python3 - <<'PY'
          import base64, json
          with open('/tmp/playlist.json', encoding='utf-8') as f:
              data = json.load(f)
          entries = data.get('entries') or []
          print(f'PLAYLIST_COUNT|{len(entries)}')
          for i, item in enumerate(entries, 1):
              if not item:
                  continue
              video_id = item.get('id') or ''
              title = (item.get('title') or '').replace('\n', ' ').replace('|', '¦')
              description = item.get('description') or ''
              encoded = base64.b64encode(description.encode('utf-8')).decode('ascii')
              print(f'PLAYLIST_ITEM|{i}|{video_id}|{title}|{encoded}')
          PY

name: Apply random video order and title labels

on:
  push:
    paths:
      - '.github/workflows/apply-video-random-title.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/content/video-collection.js')
          js = js_path.read_text()
          old = """    let videos = (Array.isArray(block.videos) ? block.videos : [])
              .map((item) => ({...item, videoId: extractYouTubeId(item?.youtubeUrl || '')}))
              .filter((item) => item.videoId);
          """
          new = """    let videos = (Array.isArray(block.videos) ? block.videos : [])
              .map((item) => ({...item, videoId: extractYouTubeId(item?.youtubeUrl || '')}))
              .filter((item) => item.videoId);
            videos = shuffled(videos);
          """
          if old not in js:
              raise SystemExit('video initialization pattern not found')
          js = js.replace(old, new, 1)

          old = """        const number = document.createElement('span');
                  number.className = 'video-collection-thumb-number';
                  number.textContent = String(index + 1).padStart(2, '0');

                  button.append(image, number);
          """
          new = """        const thumbTitle = document.createElement('span');
                  thumbTitle.className = 'video-collection-thumb-title';
                  thumbTitle.textContent = item.title || 'Untitled video';
                  thumbTitle.title = item.title || 'Untitled video';

                  button.append(image, thumbTitle);
          """
          if old not in js:
              raise SystemExit('thumbnail label pattern not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js)

          css_path = Path('assets/content/site.css')
          css = css_path.read_text()
          old = ".video-collection-thumb-number{position:absolute;right:5px;bottom:4px;padding:2px 3px 1px;background:color-mix(in srgb,var(--media-black) 64%,transparent);color:var(--media-white);font-size:8px;line-height:1;font-variant-numeric:tabular-nums}"
          new = ".video-collection-thumb-title{position:absolute;left:5px;right:5px;bottom:4px;min-width:0;padding:3px 4px 2px;background:color-mix(in srgb,var(--media-black) 68%,transparent);color:var(--media-white);font-size:8px;line-height:1.2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}"
          if old not in css:
              raise SystemExit('thumbnail CSS pattern not found')
          css = css.replace(old, new, 1)
          css_path.write_text(css)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace('assets/content/site.css?v=20260907-2', 'assets/content/site.css?v=20260907-3')
          index = index.replace('assets/content/video-collection.js?v=20260907-2', 'assets/content/video-collection.js?v=20260907-3')
          index_path.write_text(index)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              '`video-collection.js` — Sanity에서 개별 관리되는 Video Collection의 selected player, 고정 높이 정보 패널, scrollable thumbnail tray와 browser-only Shuffle을 담당한다.',
              '`video-collection.js` — Sanity에서 개별 관리되는 Video Collection의 selected player, 4개 단위 thumbnail pagination, page-load randomization과 browser-only Shuffle을 담당한다.'
          )
          readme = readme.replace(
              '기본 `Video Collection` content block은 영상마다 Sanity에서 `YouTube URL`, `Title`, `Description`을 개별 관리한다. 배열 순서가 기본 표시 순서이고 첫 영상이 초기 선택이다.',
              '기본 `Video Collection` content block은 영상마다 Sanity에서 `YouTube URL`, `Title`, `Description`을 개별 관리한다. Sanity 배열은 source order로만 보존하며, 페이지를 열 때마다 browser에서 전체 영상을 한 번 셔플하고 그 첫 영상을 초기 선택한다.'
          )
          readme = readme.replace(
              '- thumbnail은 한 page에 4개만 표시한다. desktop은 4열, mobile은 2열 × 2행이다.',
              '- thumbnail은 한 page에 4개만 표시한다. desktop은 4열, mobile은 2열 × 2행이다. 각 thumbnail 하단에는 영상 Title을 한 줄로 표시하고 넘치는 글자는 ellipsis로 생략한다.'
          )
          readme_path.write_text(readme)
          PY
      - name: Validate JavaScript
        run: node --check assets/content/video-collection.js
      - name: Commit changes
        run: |
          git config user.name "fromhoyeon"
          git config user.email "fromhoyeon@gmail.com"
          git add assets/content/video-collection.js assets/content/site.css index.html README.md
          git commit -m "Randomize video collection on load and label thumbnails"
          git push

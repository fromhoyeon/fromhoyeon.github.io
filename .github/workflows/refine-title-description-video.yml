name: Apply title description and video pagination changes

on:
  push:
    paths:
      - '.github/workflows/refine-title-description-video.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend and docs
        run: python3 .github/refine-title-description-video.py
      - name: Validate JavaScript
        run: |
          node --check assets/content/video-collection.js
          node --check assets/content/sanity-runtime.js
          node --check assets/content/sanity-site-bridge.js
      - name: Commit implementation
        run: |
          git config user.name "fromhoyeon"
          git config user.email "fromhoyeon@gmail.com"
          git add assets/content/site.css assets/content/sanity-runtime.js assets/content/sanity-site-bridge.js assets/content/video-collection.js index.html README.md sanity/README.md
          git commit -m "Separate title descriptions and paginate video thumbnails"
          git push

name: Apply video collection editorial design

on:
  push:
    paths:
      - '.github/workflows/apply-video-design.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Video Collection interaction and visual detail
        run: |
          cat > assets/content/video-collection.js <<'EOF'
          /*
            Sanity-curated Video Collection.
            Each video is managed independently in Sanity with a YouTube URL, title and description.
            Playlist-driven legacy blocks delegate to the archived playlist renderer.
          */

          (function initVideoCollection(){
            if (window.HOYEON_VIDEO_COLLECTION) return;

            function extractYouTubeId(value){
              if (!value || typeof value !== 'string') return '';
              try {
                const url = new URL(value);
                const host = url.hostname.replace(/^www\./, '');
                if (host === 'youtu.be') return url.pathname.split('/').filter(Boolean)[0] || '';
                if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
                  if (url.searchParams.get('v')) return url.searchParams.get('v') || '';
                  const parts = url.pathname.split('/').filter(Boolean);
                  const marker = parts.findIndex((part) => part === 'embed' || part === 'shorts' || part === 'live');
                  if (marker >= 0 && parts[marker + 1]) return parts[marker + 1];
                }
              } catch (error) {
                return '';
              }
              return '';
            }

            function thumbnailUrl(videoId){
              return `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
            }

            function shuffled(items){
              const output = items.slice();
              for (let i = output.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [output[i], output[j]] = [output[j], output[i]];
              }
              return output;
            }

            function fastScrollTo(element, duration = 180){
              if (!element) return;
              const headerOffset = window.matchMedia('(max-width:620px)').matches ? 44 : 50;
              const startY = window.scrollY;
              const targetY = Math.max(0, startY + element.getBoundingClientRect().top - headerOffset);
              const distance = targetY - startY;
              if (Math.abs(distance) < 2) return;
              if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                window.scrollTo(0, targetY);
                return;
              }
              const startedAt = performance.now();
              const step = (now) => {
                const progress = Math.min(1, (now - startedAt) / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                window.scrollTo(0, startY + distance * eased);
                if (progress < 1) requestAnimationFrame(step);
              };
              requestAnimationFrame(step);
            }

            function render(block, work){
              if (block?.playlistUrl && window.HOYEON_PLAYLIST_VIDEO_COLLECTION?.render) {
                return window.HOYEON_PLAYLIST_VIDEO_COLLECTION.render(block, work);
              }

              let videos = (Array.isArray(block.videos) ? block.videos : [])
                .map((item) => ({...item, videoId: extractYouTubeId(item?.youtubeUrl || '')}))
                .filter((item) => item.videoId);

              const breakout = document.createElement('div');
              breakout.className = 'video-collection-breakout';

              const collection = document.createElement('div');
              collection.className = 'video-collection';
              breakout.appendChild(collection);

              if (!videos.length) {
                const empty = document.createElement('div');
                empty.className = 'video-collection-message';
                empty.textContent = 'Video collection is empty';
                collection.appendChild(empty);
                return breakout;
              }

              const stage = document.createElement('div');
              stage.className = 'video-collection-stage yt-stage';
              stage.tabIndex = -1;

              const info = document.createElement('div');
              info.className = 'video-collection-info';

              const meta = document.createElement('div');
              meta.className = 'video-collection-meta';

              const currentTitle = document.createElement('div');
              currentTitle.className = 'video-collection-current-title';

              const status = document.createElement('div');
              status.className = 'video-collection-status';

              const descriptionShell = document.createElement('div');
              descriptionShell.className = 'video-collection-description-shell';

              const currentDescription = document.createElement('div');
              currentDescription.className = 'video-collection-description';
              currentDescription.tabIndex = 0;
              currentDescription.setAttribute('aria-label', 'Selected video description');

              meta.append(currentTitle, status);
              descriptionShell.appendChild(currentDescription);
              info.append(meta, descriptionShell);

              const tray = document.createElement('div');
              tray.className = 'video-collection-tray';

              const trayHead = document.createElement('div');
              trayHead.className = 'video-collection-tray-head';

              const trayCount = document.createElement('span');
              trayCount.className = 'video-collection-tray-count';

              const shuffleButton = document.createElement('button');
              shuffleButton.className = 'video-collection-shuffle';
              shuffleButton.type = 'button';
              shuffleButton.textContent = 'Shuffle ↝';

              trayHead.append(trayCount, shuffleButton);

              const gridViewport = document.createElement('div');
              gridViewport.className = 'video-collection-grid-viewport';

              const grid = document.createElement('div');
              grid.className = 'video-collection-grid';
              grid.setAttribute('aria-label', `${block.title || work.title || 'Video'} collection`);
              gridViewport.appendChild(grid);
              tray.append(trayHead, gridViewport);

              let activeIndex = 0;
              let buttons = [];

              function updateDescriptionFade(){
                const remaining = currentDescription.scrollHeight - currentDescription.scrollTop - currentDescription.clientHeight;
                descriptionShell.classList.toggle('has-more', remaining > 3);
              }

              function syncActive(){
                buttons.forEach((button, buttonIndex) => {
                  const active = buttonIndex === activeIndex;
                  button.classList.toggle('is-active', active);
                  button.setAttribute('aria-current', active ? 'true' : 'false');
                });
              }

              function renderStage(index){
                const item = videos[index];
                if (!item) return;
                activeIndex = index;

                stage.replaceChildren();
                const poster = document.createElement('button');
                poster.className = 'yt-poster';
                poster.type = 'button';
                poster.setAttribute('aria-label', `Play ${item.title || 'video'}`);

                const image = document.createElement('img');
                image.src = thumbnailUrl(item.videoId);
                image.alt = '';

                const play = document.createElement('span');
                play.className = 'yt-play';
                play.setAttribute('aria-hidden', 'true');
                play.textContent = '▶';

                poster.append(image, play);
                poster.addEventListener('click', () => {
                  const iframe = document.createElement('iframe');
                  iframe.title = `${item.title || 'YouTube'} video player`;
                  iframe.src = `https://www.youtube-nocookie.com/embed/${item.videoId}?autoplay=1&controls=1&rel=0&playsinline=1&iv_load_policy=3`;
                  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
                  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
                  iframe.setAttribute('allowfullscreen', '');
                  stage.replaceChildren(iframe);
                });
                stage.appendChild(poster);

                currentTitle.textContent = item.title || 'Untitled video';
                currentDescription.textContent = item.description || '';
                currentDescription.scrollTop = 0;
                status.textContent = `${index + 1} / ${videos.length}`;
                syncActive();
                requestAnimationFrame(updateDescriptionFade);
              }

              function renderGrid(){
                grid.replaceChildren();
                buttons = videos.map((item, index) => {
                  const button = document.createElement('button');
                  button.className = 'video-collection-thumb';
                  button.type = 'button';
                  button.setAttribute('aria-label', `Select ${item.title || `video ${index + 1}`}`);

                  const image = document.createElement('img');
                  image.src = thumbnailUrl(item.videoId);
                  image.alt = '';
                  image.loading = 'lazy';
                  image.decoding = 'async';

                  const number = document.createElement('span');
                  number.className = 'video-collection-thumb-number';
                  number.textContent = String(index + 1).padStart(2, '0');

                  button.append(image, number);
                  button.addEventListener('click', () => {
                    renderStage(index);
                    if (window.matchMedia('(max-width:620px)').matches) fastScrollTo(stage);
                  });
                  grid.appendChild(button);
                  return button;
                });
                trayCount.textContent = `${videos.length} videos`;
                syncActive();
              }

              shuffleButton.addEventListener('click', () => {
                const previousFirstId = videos[0]?.videoId;
                videos = shuffled(videos);
                if (videos.length > 1 && videos[0]?.videoId === previousFirstId) {
                  const swapIndex = 1 + Math.floor(Math.random() * (videos.length - 1));
                  [videos[0], videos[swapIndex]] = [videos[swapIndex], videos[0]];
                }
                activeIndex = 0;
                gridViewport.scrollTop = 0;
                renderGrid();
                renderStage(0);
                if (window.matchMedia('(max-width:620px)').matches) fastScrollTo(stage);
              });

              currentDescription.addEventListener('scroll', updateDescriptionFade, {passive:true});
              if (typeof ResizeObserver === 'function') {
                const observer = new ResizeObserver(updateDescriptionFade);
                observer.observe(currentDescription);
              }

              collection.append(stage, info, tray);
              renderGrid();
              renderStage(0);
              return breakout;
            }

            window.HOYEON_VIDEO_COLLECTION = {render, extractYouTubeId};
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing pattern: {label}')
              return text.replace(old, new, 1)

          css_path = Path('assets/content/site.css')
          css = css_path.read_text()
          css = replace_once(
              css,
              '.work-head{display:grid;grid-template-columns:32px 1fr auto;gap:var(--m);align-items:start;border-top:1px solid var(--fg);padding:10px 0 var(--m)}',
              '.work-head{display:grid;grid-template-columns:32px 1fr auto;gap:var(--m);align-items:start;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);padding:10px 0 11px;margin-bottom:18px}',
              'work-head'
          )
          css = replace_once(
              css,
              '.description p{max-width:500px;font-size:13px}\n',
              '.description p{max-width:500px;font-size:13px}\n.description.is-section-intro{display:grid;grid-template-columns:1fr auto;gap:var(--m);padding:0 0 22px;align-items:start}\n.description.is-section-intro p{max-width:560px;font-size:12px;line-height:1.55;color:var(--muted)}\n',
              'section intro styles'
          )

          start = css.index('.video-collection-breakout{')
          end_marker = 'a.video-collection-message:hover,a.video-collection-message:focus-visible{border-color:var(--fg);color:var(--fg)}'
          end = css.index(end_marker, start) + len(end_marker)
          video_css = r'''.video-collection-breakout{width:min(calc(100vw - 24px),var(--video));margin-left:50%;transform:translateX(-50%)}
.video-collection{display:grid;gap:0}
.video-collection-stage{width:100%;aspect-ratio:16/9;background:var(--media-black)}
.video-collection-stage iframe{display:block;width:100%;height:100%;border:0}
.video-collection-info{--video-info-bg:color-mix(in srgb,var(--panel) 20%,var(--bg));height:132px;display:grid;grid-template-rows:auto minmax(0,1fr);padding:14px 16px 12px;background:var(--video-info-bg);border-bottom:1px solid var(--line)}
.video-collection-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--m);align-items:baseline;padding-bottom:10px}
.video-collection-current-title{min-width:0;font-size:13px;line-height:1.3;font-weight:500;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-collection-status{font-size:9px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.video-collection-description-shell{position:relative;min-height:0;overflow:hidden}
.video-collection-description{height:100%;overflow-y:auto;padding-right:14px;font-size:11.5px;line-height:1.55;color:var(--muted);white-space:pre-line;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.video-collection-description:focus-visible{outline:1px solid var(--line);outline-offset:2px}
.video-collection-description-shell.has-more::after{content:'';position:absolute;left:0;right:6px;bottom:0;height:28px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--video-info-bg))}
.video-collection-tray{padding-top:12px}
.video-collection-tray-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--m);padding:0 0 7px;border-bottom:1px solid var(--line)}
.video-collection-tray-count{font-size:9px;line-height:1;color:var(--muted);letter-spacing:.055em;text-transform:uppercase}
.video-collection-shuffle{appearance:none;border:0;padding:0;background:transparent;color:var(--fg);font-size:9px;line-height:1;letter-spacing:.055em;text-transform:uppercase;cursor:pointer}
.video-collection-shuffle:hover{text-decoration:underline;text-underline-offset:3px}
.video-collection-shuffle:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
.video-collection-grid-viewport{max-height:204px;overflow-y:auto;padding-top:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.video-collection-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s)}
.video-collection-thumb{appearance:none;border:0;padding:0;margin:0;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--panel);cursor:pointer}
.video-collection-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .12s ease}
.video-collection-thumb::after{content:'';position:absolute;inset:0;border:1px solid transparent;pointer-events:none;transition:border-color .12s ease}
.video-collection-thumb:hover img,.video-collection-thumb:focus-visible img{opacity:.82}
.video-collection-thumb.is-active::after{border-color:var(--fg)}
.video-collection-thumb:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.video-collection-thumb-number{position:absolute;right:5px;bottom:4px;padding:2px 3px 1px;background:color-mix(in srgb,var(--media-black) 64%,transparent);color:var(--media-white);font-size:8px;line-height:1;font-variant-numeric:tabular-nums}
.video-collection-message{min-height:96px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
a.video-collection-message:hover,a.video-collection-message:focus-visible{border-color:var(--fg);color:var(--fg)}'''
          css = css[:start] + video_css + css[end:]

          old_mobile = '''  .video-collection{gap:10px}\n  .video-collection-stage{scroll-margin-top:46px}\n  .video-collection-meta{padding:0 10px;gap:10px}\n  .video-collection-current-title{font-size:11px}\n  .video-collection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}'''
          new_mobile = '''  .work-head{margin-bottom:14px}\n  .description.is-section-intro{padding:0 0 18px}\n  .video-collection-info{height:126px;padding:12px 12px 10px}\n  .video-collection-meta{gap:10px;padding-bottom:8px}\n  .video-collection-current-title{font-size:12px}\n  .video-collection-description{font-size:11px;line-height:1.5;padding-right:10px}\n  .video-collection-description-shell.has-more::after{height:24px}\n  .video-collection-tray{padding:10px 10px 0}\n  .video-collection-tray-head{padding-bottom:7px}\n  .video-collection-grid-viewport{max-height:55vw;padding-top:5px}\n  .video-collection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}'''
          css = replace_once(css, old_mobile, new_mobile, 'mobile video collection')
          css_path.write_text(css)

          bridge_path = Path('assets/content/sanity-site-bridge.js')
          bridge = bridge_path.read_text()
          old_bridge = '''    const hasBlocks = renderContentBlocks(section, work);\n    if (hasBlocks) return;\n\n    if (work.mediaType === 'youtube') {'''
          new_bridge = '''    const hasBlocks = renderContentBlocks(section, work);\n    if (hasBlocks) {\n      const hasCuratedVideoCollection = Array.isArray(work.contentBlocks) && work.contentBlocks.some((block) => block?._type === 'workCuratedVideoCollectionBlock');\n      if (descriptionBox) {\n        descriptionBox.classList.toggle('is-section-intro', hasCuratedVideoCollection && hasSummary);\n        const content = section.querySelector(':scope > .sanity-content-blocks');\n        if (hasCuratedVideoCollection && hasSummary && content) section.insertBefore(descriptionBox, content);\n      }\n      return;\n    }\n\n    descriptionBox?.classList.remove('is-section-intro');\n    if (work.mediaType === 'youtube') {'''
          bridge = replace_once(bridge, old_bridge, new_bridge, 'section intro bridge')
          bridge_path.write_text(bridge)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace('assets/content/site.css?v=20260906-3', 'assets/content/site.css?v=20260907-1')
          index = index.replace('assets/content/video-collection.js?v=20260906-2', 'assets/content/video-collection.js?v=20260907-1')
          index = index.replace('assets/content/sanity-site-bridge.js?v=20260906-3', 'assets/content/sanity-site-bridge.js?v=20260907-1')
          index_path.write_text(index)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              '- `video-collection.js` — YouTube playlist URL 하나를 받아 playlist 전체를 선택형 player + thumbnail grid로 표시한다.',
              '- `video-collection.js` — Sanity에서 개별 관리되는 Video Collection의 selected player, 고정 높이 정보 패널, scrollable thumbnail tray와 browser-only Shuffle을 담당한다.\n- `playlist-video-collection.js` — YouTube playlist URL 하나로 전체 목록을 자동 구성하는 보존용 playlist renderer.'
          )
          readme = re.sub(
              r'## Video Collection\n.*?\n## Sanity 경계',
              '''## Video Collection\n\n기본 `Video Collection` content block은 영상마다 Sanity에서 `YouTube URL`, `Title`, `Description`을 개별 관리한다. 배열 순서가 기본 표시 순서이고 첫 영상이 초기 선택이다.\n\n- 선택된 영상은 상단 16:9 player에 표시한다.\n- player 아래 정보 패널은 고정 높이이며 제목, 현재/전체 번호와 description을 표시한다.\n- description이 패널 높이를 넘으면 내부 세로 스크롤을 사용하고, 아래에 내용이 더 남아 있을 때만 하단 fade cue를 표시한다.\n- mobile thumbnail tray는 2열 × 약 2행 높이의 내부 스크롤 viewport다. desktop은 5열과 제한된 높이를 사용한다.\n- thumbnail 선택 시 mobile에서는 native smooth scroll보다 짧은 custom transition으로 player 위치로 빠르게 이동한다.\n- `Shuffle`은 현재 browser session의 영상/thumbnail 순서와 선택 영상만 섞는다. Sanity 배열 순서는 수정하지 않는다.\n- section-level summary가 있는 Video Collection Portfolio Item은 work header 바로 아래에서 intro copy로 표시한다.\n- `Playlist Video Collection · backup`은 playlist URL 하나로 목록을 자동 생성하는 별도 보존 기능이다.\n\n## Sanity 경계''',
              readme,
              flags=re.S
          )
          readme_path.write_text(readme)

          sanity_readme_path = Path('sanity/README.md')
          sanity_readme = sanity_readme_path.read_text()
          sanity_readme = sanity_readme.replace(
              '- `workVideoCollectionBlock` — YouTube playlist 기반 video collection block.',
              '- `workCuratedVideoCollectionBlock` / `workCuratedVideoItem` — 기본 Video Collection. 각 영상의 YouTube URL, Title, Description을 Sanity에서 개별 관리한다.\n- `workVideoCollectionBlock` — `Playlist Video Collection · backup`. YouTube playlist 기반 자동 collection block.'
          )
          sanity_readme = sanity_readme.replace(
              '- `Video Collection`\n- `Text`',
              '- `Video Collection`\n- `Playlist Video Collection · backup`\n- `Text`'
          )
          sanity_readme = re.sub(
              r'`Video Collection`은 초기 운용 편의성을 우선해.*?schema 확장을 검토한다\.\n',
              '''기본 `Video Collection`은 `videos[]` 배열을 사용한다. 각 item의 최소 필드는 `YouTube URL`, `Title`, `Description`이며 Sanity 배열 순서가 기본 표시 순서다. 첫 item이 초기 선택 영상이다. 향후 year, credit, role 등이 실제로 필요할 때 item field를 추가한다.\n\n표시 영역의 높이, description 내부 scroll/fade, thumbnail tray, mobile 이동 속도와 browser-only Shuffle은 frontend 책임이다. Shuffle은 Content Lake의 배열 순서를 변경하지 않는다.\n\n기존 playlist 자동 추출 구현은 `Playlist Video Collection · backup`으로 유지한다. 이 block만 `playlistUrl` 하나를 source로 사용한다.\n''',
              sanity_readme,
              flags=re.S
          )
          sanity_readme = sanity_readme.replace(
              '- `assets/content/video-collection.js` — YouTube playlist를 selected player + thumbnail grid로 표시',
              '- `assets/content/video-collection.js` — curated Video Collection의 selected player, info panel, scrollable tray와 Shuffle\n- `assets/content/playlist-video-collection.js` — 보존용 YouTube playlist 자동 collection renderer'
          )
          sanity_readme_path.write_text(sanity_readme)
          PY

          node --check assets/content/video-collection.js
          node --check assets/content/sanity-site-bridge.js

      - name: Commit implementation
        run: |
          git config user.name "fromhoyeon"
          git config user.email "fromhoyeon@gmail.com"
          git add assets/content/video-collection.js assets/content/site.css assets/content/sanity-site-bridge.js index.html README.md sanity/README.md
          git commit -m "Refine Video Collection editorial UI"
          git push
